[project]
name = "novamart-support-agent"
version = "0.1.0"
description = "Internal support agent for NovaMart store employees, built with Google ADK + Gemini"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-adk>=1.0",
    "google-genai>=1.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novamart_agent"]
